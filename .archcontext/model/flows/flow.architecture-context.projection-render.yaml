applicability: "required"
capabilityId: "capability.architecture.context"
id: "flow.architecture-context.projection-render"
name: "Project the accepted architecture model into documentation"
outcomes:
  - id: "projected"
    kind: "success"
    label: "The projection plan is renderable"
    steps:
      - evidence:
          entrypointId: "entrypoint.architecture-context.projection-service"
          sinkId: "sink.architecture-context.render"
          sourceSymbol: "buildArchitectureDocsProjection"
        from: "trigger"
        id: "emit-plan"
        label: "Emit the projection plan and its per-target stamps"
        to: "renderer"
    terminal:
      label: "Return the projection plan"
      participant: "trigger"
  - id: "unprovable"
    kind: "error"
    label: "A declared footprint has no measured scale signal"
    steps:
      - evidence:
          entrypointId: "entrypoint.architecture-context.projection-service"
          sinkId: "sink.architecture-context.render"
          sourceSymbol: "buildArchitectureDocsProjection"
        from: "trigger"
        id: "fail-closed"
        label: "Refuse to project rather than print an unmeasured guess"
        to: "renderer"
    terminal:
      label: "Return a typed projection failure"
      participant: "trigger"
participants:
  - id: "trigger"
    nodeId: "capability.architecture.context"
  - id: "renderer"
    nodeId: "component.architecture-context.projection-renderer"
schemaVersion: "archcontext.flow/v1"
steps:
  - evidence:
      entrypointId: "entrypoint.architecture-context.projection-service"
      sinkId: "sink.architecture-context.render"
      sourceSymbol: "buildArchitectureDocsProjection"
    from: "trigger"
    id: "render-from-projection-service"
    label: "Render a typed CLI or MCP projection request through the daemon service"
    to: "renderer"
  - evidence:
      entrypointId: "entrypoint.architecture-context.daemon"
      sinkId: "sink.architecture-context.render-daemon"
      sourceSymbol: "completeTaskProjectionDrift"
    from: "trigger"
    id: "render-from-daemon"
    label: "Render the projection for a daemon-measured stamp lifecycle"
    to: "renderer"
