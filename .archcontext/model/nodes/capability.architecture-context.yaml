id: "capability.architecture-context"
kind: "capability"
name: "Architecture Context"
schemaVersion: "archcontext.node/v2"
source:
  entrypoints:
    - id: "entrypoint.architecture-context.cli"
      path: "packages/surfaces/cli/src/main.ts"
      symbols:
        - name: "buildArchitectureDocsProjection"
          sinks:
            - id: "sink.architecture-context.render"
              path: "packages/core/projection-engine/src/index.ts"
              symbol: "renderArchitectureDocumentationProjection"
    - id: "entrypoint.architecture-context.daemon"
      path: "packages/local-runtime/runtime-daemon/src/index.ts"
      symbols:
        - name: "completeTaskProjectionDrift"
          sinks:
            - id: "sink.architecture-context.render-daemon"
              path: "packages/core/projection-engine/src/index.ts"
              symbol: "renderArchitectureDocumentationProjection"
  exclude:
    - "packages/**/test/**"
  include:
    - "packages/**/src/**"
status: "active"
summary: "Keeps product and architecture intent available to coding agents."