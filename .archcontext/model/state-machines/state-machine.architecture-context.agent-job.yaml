capabilityId: "capability.architecture.context"
events:
  - id: "enqueue"
    label: "Enqueue evicts or supersedes queued jobs"
    source:
      confirmedDigest: "sha256:51eba8ae544823a3590c45ad4ba860e3dc0fb170dc54675a95cb1acdcc07a853"
      kind: "code"
      path: "packages/local-runtime/local-store-sqlite/src/index.ts"
      symbol: "SqliteLocalStore.enqueueRuntimeAgentJob"
    steps:
      - then:
          job: "expired"
        when:
          job:
            - "queued"
      - then:
          job: "superseded"
        when:
          job:
            - "queued"
  - id: "claim"
    label: "Claim a queued job or an expired lease"
    source:
      confirmedDigest: "sha256:758170a1cc5c91f54c28102919fc447c1e62f8de461e50b90f0059f67618c49b"
      kind: "code"
      path: "packages/local-runtime/local-store-sqlite/src/index.ts"
      symbol: "SqliteLocalStore.claimRuntimeAgentJob"
    steps:
      - then:
          job: "failed"
        when:
          job:
            - "queued"
            - "running"
      - then:
          job: "running"
        when:
          job:
            - "queued"
            - "running"
  - id: "complete"
    label: "Complete a running job"
    source:
      confirmedDigest: "sha256:16a6240d52b047c50e3539b4774008661e36ae6b961fc5beb4063e8f7c5f9d9e"
      kind: "code"
      path: "packages/local-runtime/local-store-sqlite/src/index.ts"
      symbol: "SqliteLocalStore.completeRuntimeAgentJob"
    steps:
      - then:
          job: "succeeded"
        when:
          job:
            - "running"
      - then:
          job: "failed"
        when:
          job:
            - "running"
  - id: "retry"
    label: "Retry a job"
    source:
      confirmedDigest: "sha256:fd5e7da7ce2b28ed044e4f3f31b7a0a073c90c06227f5f2fca566fb6ba15a7d4"
      kind: "code"
      path: "packages/local-runtime/local-store-sqlite/src/index.ts"
      symbol: "SqliteLocalStore.retryRuntimeAgentJob"
    steps:
      - then:
          job: "failed"
        when:
          job:
            - "queued"
            - "running"
            - "succeeded"
            - "failed"
            - "cancelled"
            - "superseded"
            - "expired"
      - then:
          job: "queued"
        when:
          job:
            - "queued"
            - "running"
            - "succeeded"
            - "failed"
            - "cancelled"
            - "superseded"
            - "expired"
  - id: "cancel"
    label: "Cancel, supersede or expire a job"
    source:
      confirmedDigest: "sha256:12868d6763486acf49f289d3ef1176e8e1fab67ff295966a316e20ea0bebe379"
      kind: "code"
      path: "packages/local-runtime/local-store-sqlite/src/index.ts"
      symbol: "SqliteLocalStore.cancelRuntimeAgentJob"
    steps:
      - then:
          job: "cancelled"
        when:
          job:
            - "queued"
            - "running"
            - "succeeded"
            - "failed"
            - "cancelled"
            - "superseded"
            - "expired"
      - then:
          job: "superseded"
        when:
          job:
            - "queued"
            - "running"
            - "succeeded"
            - "failed"
            - "cancelled"
            - "superseded"
            - "expired"
      - then:
          job: "expired"
        when:
          job:
            - "queued"
            - "running"
            - "succeeded"
            - "failed"
            - "cancelled"
            - "superseded"
            - "expired"
  - id: "cancel-stale"
    label: "Expire queued or running jobs of a stale head"
    source:
      confirmedDigest: "sha256:a379a6c7b82257ff8fdd0e7fe033dc868ada3124aeaa93bc8c001b882f746c49"
      kind: "code"
      path: "packages/local-runtime/local-store-sqlite/src/index.ts"
      symbol: "SqliteLocalStore.cancelStaleRuntimeAgentJobs"
    steps:
      - then:
          job: "expired"
        when:
          job:
            - "queued"
            - "running"
id: "state-machine.architecture-context.agent-job"
name: "Agent job lifecycle"
regions:
  - id: "job"
    initial: "queued"
    label: "Job status"
    states:
      - id: "queued"
        label: "Queued"
      - id: "running"
        label: "Running"
      - id: "succeeded"
        label: "Succeeded"
        terminal: true
      - id: "failed"
        label: "Failed"
        terminal: true
      - id: "cancelled"
        label: "Cancelled"
        terminal: true
      - id: "superseded"
        label: "Superseded"
        terminal: true
      - id: "expired"
        label: "Expired"
        terminal: true
rules:
  - final:
      job:
        - "succeeded"
        - "failed"
        - "cancelled"
        - "superseded"
        - "expired"
    finding:
      tracking: "https://github.com/Ancienttwo/arch-context/issues/509"
    id: "terminal-status-is-final"
    label: "A terminal job status never changes"
schemaVersion: "archcontext.state-machine/v1"
