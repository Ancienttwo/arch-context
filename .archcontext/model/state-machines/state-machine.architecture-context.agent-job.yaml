capabilityId: "capability.architecture.context"
events:
  - id: "enqueue"
    label: "Enqueue evicts or supersedes queued jobs"
    source:
      confirmedDigest: "sha256:6069aa178d13b844530b640aa56f1b92bcbcaa08ece9ae5c0ba60d7b6b1a31b6"
      kind: "code"
      path: "packages/local-runtime/local-store-sqlite/src/index.ts"
      symbol: "SqliteLocalStore.enqueueRuntimeAgentJob"
    steps:
      - then:
          job: "expired"
        when:
          job:
            - "queued"
      - then:
          job: "superseded"
        when:
          job:
            - "queued"
  - id: "claim"
    label: "Claim a queued job or an expired lease"
    source:
      confirmedDigest: "sha256:3afa459740f7144d6df96cccbb4b62a3ac1606791662f19580b16017647f2760"
      kind: "code"
      path: "packages/local-runtime/local-store-sqlite/src/index.ts"
      symbol: "SqliteLocalStore.claimRuntimeAgentJob"
    steps:
      - then:
          job: "failed"
        when:
          job:
            - "queued"
            - "running"
      - then:
          job: "running"
        when:
          job:
            - "queued"
            - "running"
  - id: "complete"
    label: "Complete a running job"
    source:
      confirmedDigest: "sha256:78b24a2bd65de66dd0a3ace3d180ca25c555a0779d912ab6abd99c763a2bbe11"
      kind: "code"
      path: "packages/local-runtime/local-store-sqlite/src/index.ts"
      symbol: "SqliteLocalStore.completeRuntimeAgentJob"
    steps:
      - then:
          job: "succeeded"
        when:
          job:
            - "running"
      - then:
          job: "failed"
        when:
          job:
            - "running"
  - id: "retry"
    label: "Retry a job"
    source:
      confirmedDigest: "sha256:bcce99966cfe4f8f648610d9689297dbbcd3698d70d7173030d9be2fe4cb8afb"
      kind: "code"
      path: "packages/local-runtime/local-store-sqlite/src/index.ts"
      symbol: "SqliteLocalStore.retryRuntimeAgentJob"
    steps:
      - then:
          job: "failed"
        when:
          job:
            - "failed"
      - then:
          job: "queued"
        when:
          job:
            - "failed"
  - id: "cancel"
    label: "Cancel, supersede or expire a job"
    source:
      confirmedDigest: "sha256:24d4c1cc56e0f93f869254a7eeb9e1c6d8bf1282586a5432b6206c9dd8a2d62b"
      kind: "code"
      path: "packages/local-runtime/local-store-sqlite/src/index.ts"
      symbol: "SqliteLocalStore.cancelRuntimeAgentJob"
    steps:
      - then:
          job: "cancelled"
        when:
          job:
            - "queued"
            - "running"
      - then:
          job: "superseded"
        when:
          job:
            - "queued"
      - then:
          job: "expired"
        when:
          job:
            - "queued"
            - "running"
  - id: "cancel-stale"
    label: "Expire queued or running jobs of a stale head"
    source:
      confirmedDigest: "sha256:c7ff440ac3a21e6de7b1eb2fe5399e550c2adba610b052f6c5b904c716105de8"
      kind: "code"
      path: "packages/local-runtime/local-store-sqlite/src/index.ts"
      symbol: "SqliteLocalStore.cancelStaleRuntimeAgentJobs"
    steps:
      - then:
          job: "expired"
        when:
          job:
            - "queued"
            - "running"
id: "state-machine.architecture-context.agent-job"
name: "Agent job lifecycle"
regions:
  - id: "job"
    initial: "queued"
    label: "Job status"
    states:
      - id: "queued"
        label: "Queued"
      - id: "running"
        label: "Running"
      - id: "succeeded"
        label: "Succeeded"
        terminal: true
      - id: "failed"
        label: "Failed"
      - id: "cancelled"
        label: "Cancelled"
        terminal: true
      - id: "superseded"
        label: "Superseded"
        terminal: true
      - id: "expired"
        label: "Expired"
        terminal: true
rules:
  - final:
      job:
        - "succeeded"
        - "cancelled"
        - "superseded"
        - "expired"
    id: "terminal-status-is-final"
    label: "A terminal job status never changes"
schemaVersion: "archcontext.state-machine/v1"
