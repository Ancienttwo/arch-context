name: Windows Phase Probe

# Diagnostic only. Times PowerShell launches in the Windows ACL fixture test with and without a
# PowerShell warm-up step. It does not gate anything.
on:
  push:
    branches:
      - claude/windows-phase-probe

permissions:
  contents: read

jobs:
  probe:
    name: "main / Node ${{ matrix.node-version }} / ${{ matrix.mode }}"
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
        mode: [cold, warm]
    env:
      PHASE_PROBE_SLOW_MS: "1000"
    steps:
      - name: Checkout probe
        uses: actions/checkout@v6
        with:
          path: probe-src

      - name: Checkout subject
        uses: actions/checkout@v6
        with:
          ref: 71c5e2a0d87f2a40af263586e3240821071b9f2e
          path: subject

      - name: Keep temporary files on the Windows runner work disk
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        working-directory: subject
        run: bun install --frozen-lockfile

      - name: Warm up Windows PowerShell
        if: matrix.mode == 'warm'
        shell: cmd
        run: '"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -Command "exit 0"'

      - name: Probe the ACL fixture test 30 times
        continue-on-error: true
        working-directory: subject
        env:
          PHASE_PROBE_OUT: ${{ runner.temp }}\phase-probe.out
        run: bun test --preload "${{ github.workspace }}/probe-src/probe/phase-probe.ts" packages/surfaces/cli/test/hook-state-paths.test.ts --rerun-each 30 --timeout 120000

      - name: Upload phase breakdown
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase-probe-${{ matrix.mode }}
          path: ${{ runner.temp }}\phase-probe.out
          if-no-files-found: error
