name: Windows 0.9.4 scoped diagnosis (not acceptance)
on:
  push:
    branches: [codex/diag-094-node-worker]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Real Windows caller and resource lifetime tests
        run: bun test --timeout 60000 packages/local-runtime/runtime-daemon/test/flow-selector-check.test.ts packages/local-runtime/codegraph-adapter/test/capability-projection-inputs.test.ts packages/surfaces/cli/test/ref-impact.test.ts
      - name: Bundled Node caller
        run: node scripts/codegraph-selector-node-integration.mjs
