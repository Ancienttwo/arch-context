name: Verify
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release validation {0}', inputs.sha) || 'Verify' }}

# Routine pull_request and push runs execute an impact plan (scripts/verify-ci.mjs impact): the Linux
# full-verify jobs plus only the platform families whose owned paths changed. Only release validation
# (workflow_dispatch with the approved SHA) runs the complete matrix. No trigger-level path filter:
# every event must reach the Verify gate.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact full commit SHA approved for release validation; it must equal the dispatched ref's head
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-verify:
    name: Governance Verify
    if: ${{ always() }}
    needs: [verify-linux-pre, verify-linux-shards, verify-linux-post]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      VERIFY_PREREQUISITE_RESULT: ${{ needs.verify-linux-post.result }}
      VERIFY_PREREQUISITE_CHECKOUT_SHA: ${{ needs.verify-linux-post.outputs.checkout_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Governance verify
        run: bun run verify:governance --ci-inspect

  linux-arm64-descriptor-write:
    if: contains(fromJSON(needs.verify-plan.outputs.families), 'linux-arm64')
    needs: verify-plan
    name: Linux arm64 descriptor writes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify descriptor writes on Linux arm64
        run: |
          node -e "if (process.platform !== 'linux' || process.arch !== 'arm64') process.exit(1)"
          bun test packages/core/changeset-engine/test/changeset-engine.test.ts

  verify:
    # Full verify runs once per OS at Node 22.22.x; Node 24.x and 25.x run only Node-runtime checks because Bun 1.4.4 executes the test suite.
    if: contains(fromJSON(needs.verify-plan.outputs.families), 'node-compat')
    needs: verify-plan
    name: "Verify execution: ${{ matrix.os }} / Node ${{ matrix.node-version }} / node compat"
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-plan.outputs.compat) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Keep temporary files on the Windows runner work disk
        # The system-drive temp directory has multi-second write and fsync stalls on hosted
        # Windows runners; RUNNER_TEMP is on the work disk (Windows phase probe, 2026-10-15).
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Platform IPC permission readback
        run: node scripts/platform-ipc-permission-readback.mjs > platform-ipc-permission-readback.json

      - name: Upload platform IPC permission readback
        uses: actions/upload-artifact@v6
        with:
          name: platform-ipc-permission-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: platform-ipc-permission-readback.json

      - name: Node compatibility
        run: bun run verify:node-compat

  verify-platform:
    if: contains(fromJSON(needs.verify-plan.outputs.families), 'platform')
    needs: verify-plan
    name: "Verify platform: ${{ matrix.os }} / Node ${{ matrix.node-version }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            node-version: 22.22.x
          - os: windows-latest
            node-version: 22.22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Keep temporary files on the Windows runner work disk
        # The system-drive temp directory has multi-second write and fsync stalls on hosted
        # Windows runners; RUNNER_TEMP is on the work disk (Windows phase probe, 2026-10-15).
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Platform IPC permission readback
        run: node scripts/platform-ipc-permission-readback.mjs > platform-ipc-permission-readback.json

      - name: Upload platform IPC permission readback
        uses: actions/upload-artifact@v6
        with:
          name: platform-ipc-permission-${{ matrix.os }}-node-${{ matrix.node-version }}-impact
          path: platform-ipc-permission-readback.json

      - name: Platform-sensitive suites
        run: bun run verify:platform

  verify-plan:
    name: Verify plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERIFY_DISPATCH_SHA: ${{ inputs.sha }}
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      families: ${{ steps.plan.outputs.families }}
      split: ${{ steps.plan.outputs.split }}
      shards: ${{ steps.plan.outputs.shards }}
      compat: ${{ steps.plan.outputs.compat }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: plan
        run: node scripts/verify-ci.mjs impact

  verify-split-pre:
    if: contains(fromJSON(needs.verify-plan.outputs.families), 'full-matrix')
    needs: verify-plan
    name: "Verify execution: ${{ matrix.os }} / Node ${{ matrix.node-version }} / pre"
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-plan.outputs.split) }}
    env: &split-pre-env
      VERIFY_TARGET: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    steps:
      - &split-checkout
        name: Checkout
        uses: actions/checkout@v6
      - name: Keep temporary files on the Windows runner work disk
        # The system-drive temp directory has multi-second write and fsync stalls on hosted
        # Windows runners; RUNNER_TEMP is on the work disk (Windows phase probe, 2026-10-15).
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - &split-setup-node
        name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - &split-setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - &split-install
        name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Windows control-file ACL regression
        if: runner.os == 'Windows'
        run: bun test --timeout 60000 packages/local-runtime/control-file-security/test/control-file-security.test.ts packages/local-runtime/runtime-daemon/test/daemon-control-acl.test.ts packages/local-runtime/runtime-daemon/test/rpc-server.test.ts packages/surfaces/cli/test/hook-state-paths.test.ts
      - &split-ipc-readback
        name: Platform IPC permission readback
        run: node scripts/platform-ipc-permission-readback.mjs > platform-ipc-permission-readback.json
      - &split-ipc-upload
        name: Upload platform IPC permission readback
        uses: actions/upload-artifact@v6
        with:
          name: platform-ipc-permission-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: platform-ipc-permission-readback.json
      - &split-pre-gates
        name: Verify pre-gates in original order
        run: bun run verify:pre
      - &split-plan
        name: Inventory real Bun discovery and balance full files
        id: plan
        run: bun run verify:ci plan
      - &split-plan-upload
        name: Upload run-bound discovery plan
        uses: actions/upload-artifact@v6
        with:
          name: verify-plan-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/verify-plan/plan.json
          if-no-files-found: error
          overwrite: true

  verify-split-tests:
    if: contains(fromJSON(needs.verify-plan.outputs.families), 'full-matrix')
    needs: [verify-plan, verify-split-pre]
    name: "Verify execution: ${{ matrix.os }} / Node ${{ matrix.node-version }} / shard ${{ matrix.shard }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-plan.outputs.shards) }}
    env: &split-shard-env
      VERIFY_TARGET: ${{ matrix.os }} / Node ${{ matrix.node-version }}
      VERIFY_SHARD_INDEX: ${{ matrix.index }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Keep temporary files on the Windows runner work disk
        # The system-drive temp directory has multi-second write and fsync stalls on hosted
        # Windows runners; RUNNER_TEMP is on the work disk (Windows phase probe, 2026-10-15).
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - &split-plan-download
        name: Download run-bound discovery plan
        uses: actions/download-artifact@v6
        with:
          name: verify-plan-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/verify-plan
      - &split-shard
        name: Execute assigned full files with all real assertions
        run: bun run verify:ci shard
      - &split-shard-upload
        name: Upload actual file inventory and JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify-shard-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/verify-evidence
          if-no-files-found: error
          overwrite: true

  verify-split-post:
    if: contains(fromJSON(needs.verify-plan.outputs.families), 'full-matrix')
    needs: [verify-plan, verify-split-pre, verify-split-tests]
    name: "Verify execution: ${{ matrix.os }} / Node ${{ matrix.node-version }} / post"
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-plan.outputs.split) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Keep temporary files on the Windows runner work disk
        # The system-drive temp directory has multi-second write and fsync stalls on hosted
        # Windows runners; RUNNER_TEMP is on the work disk (Windows phase probe, 2026-10-15).
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download run-bound discovery plan
        uses: actions/download-artifact@v6
        with:
          name: verify-plan-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: ${{ runner.temp }}/verify-plan
      - &split-reports-download
        name: Download every shard inventory
        uses: actions/download-artifact@v6
        with:
          pattern: verify-shard-${{ matrix.os }}-node-${{ matrix.node-version }}-*
          path: ${{ runner.temp }}/verify-reports
      - &split-coverage
        name: Prove each discovered file executed exactly once
        run: bun run verify:ci coverage
      - &split-post-gates
        name: Verify post-gates in original order with fresh local fixtures
        run: bun run verify:post

  # Governance's full-verification receipt (ADR-0055): the split steps above, as dedicated Linux jobs
  # outside the release-only full matrix, so they run on every event and never wait on another OS.
  # They are the impact plan's Linux affected-workspace job: they run the complete suite.
  verify-linux-pre:
    name: "Verify execution: ${{ matrix.os }} / Node ${{ matrix.node-version }} / pre"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy: &linux-target
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.22.x
    env: *split-pre-env
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - *split-checkout
      - *split-setup-node
      - *split-setup-bun
      - *split-install
      - name: Network-isolated local first experience
        run: node scripts/local-no-cloud-e2e.mjs > local-no-cloud-network-readback.json
      - name: Upload network isolation readback
        uses: actions/upload-artifact@v6
        with:
          name: local-no-cloud-network-linux-node-22
          path: local-no-cloud-network-readback.json
      - *split-ipc-readback
      - *split-ipc-upload
      - *split-pre-gates
      - *split-plan
      - *split-plan-upload
      - &bind-verified-checkout
        name: Bind verified checkout
        id: verified_checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-linux-shards:
    needs: verify-linux-pre
    name: "Verify execution: ${{ matrix.os }} / Node ${{ matrix.node-version }} / shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-linux-pre.outputs.shards) }}
    env: *split-shard-env
    steps:
      - *split-checkout
      - *split-setup-node
      - *split-setup-bun
      - *split-install
      - *split-plan-download
      - *split-shard
      - *split-shard-upload
      - *bind-verified-checkout

  verify-linux-post:
    needs: [verify-linux-pre, verify-linux-shards]
    name: "Verify execution: ${{ matrix.os }} / Node ${{ matrix.node-version }} / post"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy: *linux-target
    outputs:
      checkout_sha: ${{ steps.verified_checkout.outputs.sha }}
    steps:
      - *split-checkout
      - *split-setup-node
      - *split-setup-bun
      - *split-install
      - *split-plan-download
      - *split-reports-download
      - *split-coverage
      - *split-post-gates
      - *bind-verified-checkout

  verify-gate:
    # The only required check. always(): it must report when a job fails, is skipped or is cancelled,
    # because GitHub counts a skipped required check as passed.
    if: ${{ always() }}
    needs: [verify-plan, verify-linux-pre, verify-linux-shards, verify-linux-post, governance-verify, verify-platform, verify, linux-arm64-descriptor-write, verify-split-pre, verify-split-tests, verify-split-post]
    name: Verify gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERIFY_NEEDS: ${{ toJSON(needs) }}
      VERIFY_PLAN: ${{ needs.verify-plan.outputs.plan }}
      VERIFY_DISPATCH_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Require the plan's selected jobs to succeed and every other job to be skipped
        run: node scripts/verify-ci.mjs gate

  verify-cost:
    if: ${{ always() }}
    needs: verify-gate
    name: Verify runner cost
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Measure total runner minutes and repeated installs
        run: node scripts/verify-ci.mjs cost
      - name: Upload measured cost readback
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify-runner-cost-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-evidence
          if-no-files-found: error
