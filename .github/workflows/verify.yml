name: Verify
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Governance revalidation' || 'Verify' }}

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One existing matrix worker also supplies Governance's full verification prerequisite.
  verify-linux-full:
    name: "Verify execution: ubuntu-latest / Node 22.22.x / full"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      checkout_sha: ${{ steps.verified_checkout.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Network-isolated local first experience
        run: node scripts/local-no-cloud-e2e.mjs > local-no-cloud-network-readback.json

      - name: Upload network isolation readback
        uses: actions/upload-artifact@v6
        with:
          name: local-no-cloud-network-linux-node-22
          path: local-no-cloud-network-readback.json

      - name: Platform IPC permission readback
        run: node scripts/platform-ipc-permission-readback.mjs > platform-ipc-permission-readback.json

      - name: Upload platform IPC permission readback
        uses: actions/upload-artifact@v6
        with:
          name: platform-ipc-permission-ubuntu-latest-node-22.22.x
          path: platform-ipc-permission-readback.json

      - name: Verify
        run: bun run verify

      - name: Bind verified checkout
        id: verified_checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  governance-verify:
    name: Governance Verify
    if: ${{ always() }}
    needs: [verify-linux-full]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      VERIFY_PREREQUISITE_RESULT: ${{ needs.verify-linux-full.result }}
      VERIFY_PREREQUISITE_CHECKOUT_SHA: ${{ needs.verify-linux-full.outputs.checkout_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Governance verify
        run: bun run verify:governance --ci-inspect

  linux-arm64-descriptor-write:
    if: github.event_name != 'workflow_dispatch' && needs.verify-topology.outputs.lane == 'matrix'
    needs: verify-topology
    name: Linux arm64 descriptor writes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify descriptor writes on Linux arm64
        run: |
          node -e "if (process.platform !== 'linux' || process.arch !== 'arm64') process.exit(1)"
          bun test packages/core/changeset-engine/test/changeset-engine.test.ts

  verify:
    # Manual revalidation reruns Governance; main pushes and PRs touching non-linux-safe paths run the matrix (.github/verify-scope.json).
    if: github.event_name != 'workflow_dispatch' && needs.verify-topology.outputs.lane == 'matrix'
    needs: verify-topology
    name: "Verify execution: ${{ matrix.os }} / Node ${{ matrix.node-version }} / full"
    runs-on: ${{ matrix.os }}
    # Windows Node 22 completed its tests at 29 min, then hit the 30 min job limit.
    # Green Windows jobs now take 31-45 min, and several were cancelled at the 45 min limit.
    # Give the full verification and packaging steps room to finish.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
        node-version:
          - 22.22.x
          - 24.x
          - 25.x
        exclude: ${{ fromJSON(needs.verify-topology.outputs.excluded) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Keep temporary files on the Windows runner work disk
        # The system-drive temp directory has multi-second write and fsync stalls on hosted
        # Windows runners; RUNNER_TEMP is on the work disk (Windows phase probe, 2026-10-15).
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Windows control-file ACL regression
        if: runner.os == 'Windows'
        run: bun test --timeout 60000 packages/local-runtime/control-file-security/test/control-file-security.test.ts packages/local-runtime/runtime-daemon/test/daemon-control-acl.test.ts packages/local-runtime/runtime-daemon/test/rpc-server.test.ts packages/surfaces/cli/test/hook-state-paths.test.ts

      - name: Platform IPC permission readback
        run: node scripts/platform-ipc-permission-readback.mjs > platform-ipc-permission-readback.json

      - name: Upload platform IPC permission readback
        uses: actions/upload-artifact@v6
        with:
          name: platform-ipc-permission-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: platform-ipc-permission-readback.json

      - name: Verify
        run: bun run verify

  verify-topology:
    if: github.event_name != 'workflow_dispatch'
    name: Verify topology
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      split: ${{ steps.topology.outputs.split }}
      shards: ${{ steps.topology.outputs.shards }}
      excluded: ${{ steps.topology.outputs.excluded }}
      lane: ${{ steps.topology.outputs.lane }}
      targets: ${{ steps.topology.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: topology
        run: node scripts/verify-ci.mjs topology

  verify-split-pre:
    if: github.event_name != 'workflow_dispatch' && needs.verify-topology.outputs.lane == 'matrix'
    needs: verify-topology
    name: "Verify execution: ${{ matrix.os }} / Node ${{ matrix.node-version }} / pre"
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-topology.outputs.split) }}
    env:
      VERIFY_TARGET: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Keep temporary files on the Windows runner work disk
        # The system-drive temp directory has multi-second write and fsync stalls on hosted
        # Windows runners; RUNNER_TEMP is on the work disk (Windows phase probe, 2026-10-15).
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Windows control-file ACL regression
        if: runner.os == 'Windows'
        run: bun test --timeout 60000 packages/local-runtime/control-file-security/test/control-file-security.test.ts packages/local-runtime/runtime-daemon/test/daemon-control-acl.test.ts packages/local-runtime/runtime-daemon/test/rpc-server.test.ts packages/surfaces/cli/test/hook-state-paths.test.ts
      - name: Platform IPC permission readback
        run: node scripts/platform-ipc-permission-readback.mjs > platform-ipc-permission-readback.json
      - name: Upload platform IPC permission readback
        uses: actions/upload-artifact@v6
        with:
          name: platform-ipc-permission-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: platform-ipc-permission-readback.json
      - name: Verify pre-gates in original order
        run: bun run verify:pre
      - name: Inventory real Bun discovery and balance full files
        run: bun run verify:ci plan
      - name: Upload run-bound discovery plan
        uses: actions/upload-artifact@v6
        with:
          name: verify-plan-${{ matrix.os }}-node-${{ matrix.node-version }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-plan/plan.json
          if-no-files-found: error

  verify-split-tests:
    if: github.event_name != 'workflow_dispatch' && needs.verify-topology.outputs.lane == 'matrix'
    needs: [verify-topology, verify-split-pre]
    name: "Verify execution: ${{ matrix.os }} / Node ${{ matrix.node-version }} / shard ${{ matrix.shard }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-topology.outputs.shards) }}
    env:
      VERIFY_TARGET: ${{ matrix.os }} / Node ${{ matrix.node-version }}
      VERIFY_SHARD_INDEX: ${{ matrix.index }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Keep temporary files on the Windows runner work disk
        # The system-drive temp directory has multi-second write and fsync stalls on hosted
        # Windows runners; RUNNER_TEMP is on the work disk (Windows phase probe, 2026-10-15).
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download run-bound discovery plan
        uses: actions/download-artifact@v6
        with:
          name: verify-plan-${{ matrix.os }}-node-${{ matrix.node-version }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-plan
      - name: Execute assigned full files with all real assertions
        run: bun run verify:ci shard
      - name: Upload actual file inventory and JUnit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify-shard-${{ matrix.os }}-node-${{ matrix.node-version }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-evidence
          if-no-files-found: error

  verify-split-post:
    if: github.event_name != 'workflow_dispatch' && needs.verify-topology.outputs.lane == 'matrix'
    needs: [verify-topology, verify-split-pre, verify-split-tests]
    name: "Verify execution: ${{ matrix.os }} / Node ${{ matrix.node-version }} / post"
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-topology.outputs.split) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Keep temporary files on the Windows runner work disk
        # The system-drive temp directory has multi-second write and fsync stalls on hosted
        # Windows runners; RUNNER_TEMP is on the work disk (Windows phase probe, 2026-10-15).
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download run-bound discovery plan
        uses: actions/download-artifact@v6
        with:
          name: verify-plan-${{ matrix.os }}-node-${{ matrix.node-version }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-plan
      - name: Download every shard inventory
        uses: actions/download-artifact@v6
        with:
          pattern: verify-shard-${{ matrix.os }}-node-${{ matrix.node-version }}-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-reports
      - name: Prove each discovered file executed exactly once
        run: bun run verify:ci coverage
      - name: Verify post-gates in original order with fresh local fixtures
        run: bun run verify:post

  verify-collect:
    if: ${{ always() && github.event_name != 'workflow_dispatch' }}
    needs: [verify-topology, verify-linux-full, verify, verify-split-pre, verify-split-tests, verify-split-post]
    name: Verify job evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      VERIFY_LANE: ${{ needs.verify-topology.outputs.lane }}
    outputs:
      verdicts: ${{ steps.collect.outputs.verdicts }}
    steps:
      - uses: actions/checkout@v6
      - id: collect
        run: node scripts/verify-ci.mjs collect
      - name: Upload actual job conclusions and runner minutes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify-job-evidence-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-evidence
          if-no-files-found: error

  verify-summary:
    if: ${{ always() && github.event_name != 'workflow_dispatch' }}
    needs: [verify-topology, verify-collect]
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-topology.outputs.targets) }}
    env:
      VERIFY_TARGET: ${{ matrix.os }} / Node ${{ matrix.node-version }}
      VERIFY_COLLECT_RESULT: ${{ needs.verify-collect.result }}
      VERIFY_VERDICTS: ${{ needs.verify-collect.outputs.verdicts }}
    steps:
      - name: Require every expected job to have succeeded
        run: |
          node -e 'const e=process.env; if(e.VERIFY_COLLECT_RESULT!=="success" || JSON.parse(e.VERIFY_VERDICTS || "{}")[e.VERIFY_TARGET]!==true) { console.error("Missing, failed, skipped, cancelled or mismatched execution job for "+e.VERIFY_TARGET); process.exit(1); }'

  verify-cost:
    if: ${{ always() && github.event_name != 'workflow_dispatch' }}
    needs: [verify-summary, governance-verify, linux-arm64-descriptor-write]
    name: Verify runner cost
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Measure total runner minutes and repeated installs
        run: node scripts/verify-ci.mjs cost
      - name: Upload measured cost readback
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify-runner-cost-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-evidence
          if-no-files-found: error
